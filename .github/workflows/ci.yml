name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  production-playback:
    name: Verify Railway production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for this commit on Railway production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..60}; do
            deployed=$(curl -fsS https://kheyflix-production.up.railway.app/api/health | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(value).deployment?.commit || '') } catch { console.log('') } })" || true)
            if [ "$deployed" = "$EXPECTED_COMMIT" ]; then exit 0; fi
            sleep 10
          done
          echo "Railway did not deploy $EXPECTED_COMMIT within 10 minutes" >&2
          exit 1
      - run: npm run verify:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playback:production
      - name: Upload playback diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playback-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
